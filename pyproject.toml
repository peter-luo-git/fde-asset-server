[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fde-asset-server"
version = "0.1.0"
description = "FDE 资产中心服务：索引、目录、沉淀、分发与复用计量"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite==0.20.0",
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "markdown-it-py==3.0.0",
    "openpyxl==3.1.5",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "pyyaml==6.0.2",
    "sqlalchemy==2.0.36",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fde_asset"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
