# FDE 资产中心服务 · 对外接口契约（asset-v1）
#
# 由 scripts/export_openapi.py 从代码生成，不要手改；改接口后重跑脚本并一起提交。
# 说明：多数写接口的请求体目前按自由 JSON 接收，契约里只能体现路径、参数与状态码，
# 字段级的约定以 fde-web/src/features/asset/api/types.ts 和跨栈端到端测试为准。
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    SopCheckDecision:
      additionalProperties: false
      description: 人对一个检查点的决定：确认通过、退回（不通过）、清空重来。
      properties:
        decision:
          enum:
          - confirm
          - reject
          - reset
          title: Decision
          type: string
        index:
          description: 检查点在这一步里的序号，从 0 开始。
          minimum: 0.0
          title: Index
          type: integer
        note:
          default: ''
          maxLength: 2000
          title: Note
          type: string
        step:
          title: Step
          type: integer
      required:
      - step
      - index
      - decision
      title: SopCheckDecision
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WorkItemAssetLink:
      additionalProperties: false
      properties:
        asset_id:
          maxLength: 64
          minLength: 1
          title: Asset Id
          type: string
        engagement_slug:
          default: ''
          description: 可省略；如提供，必须与平台核验的任务所属项目一致。
          maxLength: 120
          title: Engagement Slug
          type: string
        force:
          default: false
          description: 往后推进时当前步骤还有没通过的检查点，确认仍然进入就传 true。
          title: Force
          type: boolean
        role:
          default: reference
          enum:
          - reference
          - sop_step
          title: Role
          type: string
        sop_step:
          anyOf:
          - type: integer
          - type: 'null'
          description: SOP 关联必须填写实际存在的整数步骤。
          title: Sop Step
      required:
      - asset_id
      title: WorkItemAssetLink
      type: object
